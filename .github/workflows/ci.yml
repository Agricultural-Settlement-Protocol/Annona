name: CI

on:
  push:
    branches: [main, dev, "fix/**", "feat/**"]
  pull_request:

env:
  PNPM_VERSION: 11.1.2
  NODE_VERSION: 22

jobs:
  # ── web2: types, lint, unit tests, build ──────────────────────────────
  web:
    name: Web2 — types, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: TypeScript check (all packages)
        run: pnpm check-types

      - name: Biome lint
        run: pnpm lint

      - name: Indexer reducer tests (pure)
        run: pnpm --filter @annona/api test

      - name: ScVal round-trip / envelope tests
        run: pnpm --filter @annona/web test

      - name: Build (all)
        run: pnpm build

  # ── web3: Soroban contract tests ──────────────────────────────────────
  contract:
    name: Web3 — cargo test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts

      - name: Contract unit tests
        run: cargo test --locked

      - name: WASM build (budget check)
        run: cargo build --release --target wasm32v1-none -p offtake-registry
