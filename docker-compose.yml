services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: annona
      POSTGRES_PASSWORD: annona
      POSTGRES_DB: annona
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U annona"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "8787:8787"
    environment:
      PORT: "8787"
      DATABASE_URL: postgresql://annona:annona@postgres:5432/annona
      STELLAR_NETWORK: testnet
      SOROBAN_RPC_URL: https://soroban-testnet.stellar.org
      HORIZON_URL: https://horizon-testnet.stellar.org
      OFFTAKE_REGISTRY_CONTRACT_ID: ""
      DIDR_TOKEN_CONTRACT_ID: ""
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      NEXT_PUBLIC_API_URL: http://localhost:8787
    depends_on:
      - api

volumes:
  pgdata:
